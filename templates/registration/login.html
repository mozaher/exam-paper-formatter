{% extends "base.html" %}
{% block title %}Sign in · Exam Platform{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:40px auto;">
  <h1>Sign in</h1>
  <p class="sub">Welcome back.</p>
  {% if form.errors %}<ul class="messages"><li class="error">Incorrect email or password.</li></ul>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Email</label>
    <input type="email" name="username" id="id_username" autofocus required>
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <div class="row" style="margin-top:16px;">
      <button class="btn" type="submit">Sign in</button>
      <a href="{% url 'signup' %}">Create an organization</a>
    </div>
  </form>
</div>
{% endblock %}
